<style>
/* Layout: une seule colonne pensée pour le téléphone. Onglets collants en haut, exercices en liste numérotée, minuteur de repos fixé en bas. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#131a22; --muted:#56636f; --line:#d3dae1;
  --accent:#0a5f8a; --accent-fg:#ffffff; --rest:#b4530a; --done:#1f7a4d; --done-bg:#dff1e7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#182026; --fg:#eef2f5; --muted:#9aa8b4; --line:#2b3741;
  --accent:#62c0ea; --accent-fg:#06202d; --rest:#f0a35a; --done:#5fd19a; --done-bg:#163526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#182026; --fg:#eef2f5; --muted:#9aa8b4; --line:#2b3741;
  --accent:#62c0ea; --accent-fg:#06202d; --rest:#f0a35a; --done:#5fd19a; --done-bg:#163526; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 140px;display:flex;flex-direction:column;gap:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tabs .wide{grid-column:span 2}
.tabs button{font:700 17px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;padding:13px 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--rest);outline-offset:2px}
.mode{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.mode input{width:22px;height:22px;accent-color:var(--accent);flex:none}
h1{font:700 40px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:16px;margin:4px 0 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.box h2{font:700 15px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warn{border-color:var(--rest)}
ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;padding-block:18px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.num{font:700 30px/1 var(--display);color:var(--accent)}
.ex h3{margin:0}
.ttl{display:block;width:100%;text-align:left;padding:0;border:0;background:none;color:inherit;cursor:pointer;font:700 27px/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.ttl small{display:block;margin-top:5px;font:600 14px/1 var(--body);text-transform:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.dose{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:8px 0 0;font-variant-numeric:tabular-nums}
.dose b{font:700 34px/1 var(--display)}
.dose span{font-size:16px;color:var(--muted)}
.dose .rest{color:var(--rest);font-weight:600}
.cue{margin:8px 0 0;font-size:16px}
.alt{margin:8px 0 0;font-size:16px;color:var(--muted)}
.alt b,.link b{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.link{margin:8px 0 0;font-size:16px;color:var(--rest);font-weight:600}
.fig{margin:12px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fig .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.fig img{width:100%;height:auto;display:block;border-radius:6px;background:var(--line)}
.fig figcaption{font:700 14px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fig p{margin:0;font-size:14px;color:var(--muted)}
.fig a{color:var(--accent);font-weight:600;font-size:16px}
.kg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.kg button{height:48px;min-width:48px;padding:0 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 20px/1 var(--display);cursor:pointer}
.kg button.up{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.kg input{width:92px;height:48px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 26px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.kg .u{font-size:15px;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.sets button{width:58px;height:52px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 24px/1 var(--display);cursor:pointer}
.sets button[aria-pressed="true"]{background:var(--done-bg);border-color:var(--done);color:var(--done)}
.ex.finished .ttl,.ex.finished .num{color:var(--muted)}
.foot{display:flex;flex-direction:column;gap:12px}
.reset{align-self:flex-start;font:600 16px var(--body);padding:12px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--fg);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer .t{font:700 52px/1 var(--display);font-variant-numeric:tabular-nums;min-width:112px}
.timer .l{flex:1;min-width:0;font-size:15px;line-height:1.25}
.timer .l b{display:block;font:700 13px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.timer button{font:700 17px/1 var(--display);text-transform:uppercase;padding:14px 10px;border-radius:6px;border:1px solid var(--bg);background:transparent;color:var(--bg);cursor:pointer}
.timer.go{background:var(--done);color:var(--surface)}
.timer.go button{border-color:var(--surface);color:var(--surface)}
.box p{margin:0}
.q h2{margin:14px 0 8px}
.q h2:first-child{margin-top:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:50px;height:46px;border-radius:6px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 18px/1 var(--display);text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.week{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.week li{display:grid;grid-template-columns:122px minmax(0,1fr);gap:10px;align-items:baseline;padding-block:13px;border-top:1px solid var(--line)}
.week li:first-child{border-top:0}
.week .d{font:700 20px/1 var(--display);text-transform:uppercase;color:var(--muted)}
.week .w{display:flex;flex-direction:column;gap:4px}
.week b{font:700 24px/1.05 var(--display);text-transform:uppercase}
.week small{font-size:15px;color:var(--muted)}
.week .off b{color:var(--muted);font-weight:600}
.week .jump b{color:var(--rest)}
.week .lnk{padding:0;border:0;background:none;font:inherit;text-transform:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:4px;cursor:pointer;text-align:left}
.box ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.box>*+ul,.box>*+ol,.box>ul+p,.box>ol+p,.box>ol+ul{margin-top:10px}
.fine{font-size:14px;color:var(--muted)}
.box p.fine{margin-top:6px}
.rec h3{font:700 27px/1.05 var(--display);text-transform:uppercase;margin:0;text-wrap:balance}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tbl th{font:700 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 0 8px}
.tbl td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl td b{display:block;font:700 17px/1.1 var(--display);text-transform:uppercase}
.tbl th+th,.tbl td+td{text-align:right;white-space:nowrap;padding-left:12px}
.tbl tfoot td{font:700 20px/1 var(--display);border-top:2px solid var(--fg)}
.grp{font:700 15px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.box ul.shop{list-style:none;padding:0;gap:6px;margin-top:0}
.shop button{width:100%;text-align:left;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);font:500 16px/1.25 var(--body);cursor:pointer}
.shop button[aria-pressed="true"]{background:var(--done-bg);border-color:var(--done);color:var(--done);text-decoration:line-through}
#shopreset{margin-top:14px}
.accs{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.box.acc{padding:0}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 14px;font:700 23px/1.1 var(--display);text-transform:uppercase}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";flex:none;font:700 28px/1 var(--display);color:var(--accent)}
.acc[open]>summary::after{content:"\2212"}
.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc summary small{display:block;margin-top:4px;font:600 13px/1.2 var(--body);text-transform:none;color:var(--muted)}
.acc summary:focus-visible{outline:3px solid var(--rest);outline-offset:-3px}
.acc .in{padding:14px;display:flex;flex-direction:column;gap:12px}
.acc .in>*{margin-top:0;margin-bottom:0}
.acc .in .grp{margin-top:6px}
.acc .in ul:not(.shop),.acc .in ol{gap:7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="tabs" role="tablist" id="tabs"></div>
    <label class="mode"><input type="checkbox" id="debut"> <span>Mode découverte (semaines 1 et 2): 2 séries, charges légères</span></label>
  </header>
  <main id="main"></main>
</div>
<div class="timer" id="timer" hidden>
  <div class="in">
    <div class="t" id="tt">0:00</div>
    <div class="l"><b id="tk">Repos</b><span id="tl"></span></div>
    <button type="button" id="plus">+30 s</button>
    <button type="button" id="stop">Stop</button>
  </div>
</div>

<template id="diet">
<div><h1>Repas</h1><p class="meta">Prise de masse: 3 200 à 3 600 kcal et 150 à 160 g de protéines par jour.</p></div>

<div class="accs">

<details class="box acc" data-acc="a1"><summary><span class="st">Ma journée type</span></summary><div class="in">
<div class="scroll"><table class="tbl">
<thead><tr><th>Repas</th><th>kcal</th><th>Prot.</th></tr></thead>
<tbody>
<tr><td><b>Matin</b> Shake maison</td><td>965</td><td>55 g</td></tr>
<tr><td><b>Midi</b> Boîte du batch</td><td>820</td><td>45 g</td></tr>
<tr><td><b>Goûter</b> 250 g fromage blanc entier, 50 g muesli, miel</td><td>420</td><td>22 g</td></tr>
<tr><td><b>Soir</b> Boîte du batch</td><td>820</td><td>45 g</td></tr>
<tr><td><b>Collation</b> Poignée de cacahuètes et un fruit, ou 2 tartines au beurre de cacahuète</td><td>280</td><td>8 g</td></tr>
</tbody>
<tfoot><tr><td>Total</td><td>3 300</td><td>175 g</td></tr></tfoot>
</table></div>
<p class="fine">Valeurs approximatives. C'est la balance qui tranche.</p>
</div></details>

<details class="box acc" data-acc="a2"><summary><span class="st">Selon le jour</span></summary><div class="in">
<ul>
<li><b>Jour de salle:</b> 1 cuillère à soupe d'huile d'olive en plus dans chaque boîte.</li>
<li><b>Jour de volley ou de match:</b> un deuxième shake, 2 h avant (400 ml de lait, 60 g d'avoine, 1 banane, 1 cuillère de beurre de cacahuète), environ 680 kcal.</li>
<li><b>Jour libre:</b> garde le shake du matin, puis mange ce que tu veux.</li>
<li><b>Déplacement:</b> 2 doses sèches (avoine et whey) dans un shaker, des cacahuètes dans le sac. Au restaurant, plat avec féculents et viande, pain et dessert.</li>
</ul>
</div></details>

<details class="box acc" data-acc="a3"><summary><span class="st">Shake du matin<small>Recette</small></span></summary><div class="in">
<p class="fine">2 min au blender · environ 965 kcal · 55 g de protéines</p>
<ul>
<li>400 ml de lait entier</li>
<li>80 g de flocons d'avoine</li>
<li>1 banane</li>
<li>2 cuillères à soupe de beurre de cacahuète</li>
<li>30 g de whey</li>
</ul>
<p>Mixe l'avoine seule quelques secondes d'abord, le shake sera plus lisse. Sans whey: remplace par 150 g de fromage blanc.</p>
</div></details>

<details class="box acc" data-acc="a4"><summary><span class="st">Le batch du dimanche</span></summary><div class="in">
<p>12 boîtes en 1 h à 1 h 15, les deux recettes en parallèle.</p>
<ol>
<li>Lance l'eau des pâtes et le riz.</li>
<li>Fais dorer le poulet dans une marmite, le bœuf dans une autre.</li>
<li>Ajoute les sauces et laisse mijoter pendant que les féculents cuisent.</li>
<li>Légumes surgelés dans les sauces pour les 5 à 8 dernières minutes.</li>
<li>Répartis: féculent, viande en sauce, légumes. Laisse tiédir avant de fermer.</li>
</ol>
<ul>
<li><b>6 boîtes au frigo</b> pour lundi, mardi, mercredi.</li>
<li><b>6 boîtes au congélateur</b> pour jeudi, vendredi, samedi. Sors-les la veille au soir.</li>
<li><b>Semaine de déplacement:</b> 9 boîtes suffisent.</li>
</ul>
</div></details>

<details class="box acc" data-acc="a5"><summary><span class="st">Poulet curry coco et riz<small>Recette A · 6 boîtes</small></span></summary><div class="in">
<p class="fine">Environ 820 kcal et 45 g de protéines par boîte</p>
<ul>
<li>1,2 kg de hauts de cuisse de poulet désossés</li>
<li>720 g de riz cru</li>
<li>400 ml de lait de coco</li>
<li>2 à 3 cuillères à soupe de pâte de curry</li>
<li>2 oignons, 2 gousses d'ail</li>
<li>1,2 kg de haricots verts ou d'épinards surgelés</li>
<li>2 cuillères à soupe d'huile d'olive, sel</li>
</ul>
<ol>
<li>Cuis le riz dans 1,4 L d'eau salée, à couvert, 12 à 15 min.</li>
<li>Coupe le poulet en morceaux. Fais-le dorer 5 à 6 min à feu vif dans l'huile.</li>
<li>Ajoute les oignons émincés, l'ail et la pâte de curry. Remue 2 min.</li>
<li>Verse le lait de coco et 200 ml d'eau. Laisse mijoter 15 min à feu moyen.</li>
<li>Ajoute les légumes surgelés, 5 à 8 min. Goûte et sale.</li>
<li>Par boîte: un sixième du riz, un sixième du poulet et de sa sauce.</li>
</ol>
</div></details>

<details class="box acc" data-acc="a6"><summary><span class="st">Bolognaise et pâtes<small>Recette B · 6 boîtes</small></span></summary><div class="in">
<p class="fine">Environ 820 kcal et 45 g de protéines par boîte</p>
<ul>
<li>1,2 kg de bœuf haché à 15 % (les steaks hachés surgelés conviennent)</li>
<li>720 g de pâtes crues</li>
<li>3 briques de coulis de tomate (1,5 kg)</li>
<li>2 oignons, 2 gousses d'ail, herbes de Provence</li>
<li>1,2 kg de brocolis ou de légumes surgelés</li>
<li>200 g d'emmental râpé</li>
<li>1 cuillère à soupe d'huile d'olive, sel, poivre</li>
</ul>
<ol>
<li>Fais revenir les oignons émincés et l'ail 3 min dans l'huile.</li>
<li>Ajoute le bœuf. Émiette-le à la spatule et fais-le dorer 6 à 8 min.</li>
<li>Verse le coulis, les herbes, sel et poivre. Laisse mijoter 20 min.</li>
<li>Cuis les pâtes 1 min de moins que le temps du paquet: elles finiront de cuire au réchauffage.</li>
<li>Ajoute les légumes surgelés dans la sauce pour les 5 à 8 dernières minutes.</li>
<li>Par boîte: un sixième des pâtes, un sixième de la sauce, une poignée d'emmental.</li>
</ol>
</div></details>

<details class="box acc" data-acc="a7"><summary><span class="st">Pour varier</span></summary><div class="in">
<p>Garde la même base (1,2 kg de protéine, 720 g de féculent, légumes) et change la sauce:</p>
<ul>
<li>Chili con carne et riz</li>
<li>Poulet teriyaki et riz</li>
<li>Dinde à la moutarde et pâtes</li>
<li>Porc au caramel et riz</li>
</ul>
<p>Ajoute du poisson gras une ou deux fois par semaine (sardines ou maquereau en boîte) et un fruit en plus de la banane.</p>
</div></details>

<details class="box acc" data-acc="a8"><summary><span class="st">Courses de la semaine<small>Carrefour</small></span></summary><div class="in">
<p class="fine">Touche un article pour le cocher.</p>
<h3 class="grp">Viande</h3>
<ul class="shop">
<li><button type="button" data-shop="v1">Hauts de cuisse de poulet désossés, 1,2 kg</button></li>
<li><button type="button" data-shop="v2">Bœuf haché 15 %, 1,2 kg</button></li>
</ul>
<h3 class="grp">Frais</h3>
<ul class="shop">
<li><button type="button" data-shop="f1">Lait entier, 4 L</button></li>
<li><button type="button" data-shop="f2">Fromage blanc entier, 2 kg</button></li>
<li><button type="button" data-shop="f3">Emmental râpé, 200 g</button></li>
</ul>
<h3 class="grp">Féculents</h3>
<ul class="shop">
<li><button type="button" data-shop="c1">Riz, 720 g (paquet de 1 kg)</button></li>
<li><button type="button" data-shop="c2">Pâtes, 720 g (paquet de 1 kg)</button></li>
<li><button type="button" data-shop="c3">Flocons d'avoine, 650 g</button></li>
<li><button type="button" data-shop="c4">Muesli croustillant, 350 g</button></li>
<li><button type="button" data-shop="c5">Pain de mie complet, 1 paquet</button></li>
</ul>
<h3 class="grp">Épicerie</h3>
<ul class="shop">
<li><button type="button" data-shop="e1">Lait de coco, 400 ml</button></li>
<li><button type="button" data-shop="e2">Coulis de tomate, 3 briques de 500 g</button></li>
<li><button type="button" data-shop="e3">Beurre de cacahuète, 1 grand pot</button></li>
<li><button type="button" data-shop="e4">Cacahuètes ou fruits secs, 200 g</button></li>
</ul>
<h3 class="grp">Fruits et légumes</h3>
<ul class="shop">
<li><button type="button" data-shop="l1">Bananes, 10 à 12</button></li>
<li><button type="button" data-shop="l2">Oignons, 4</button></li>
<li><button type="button" data-shop="l3">Légumes surgelés, 2,5 kg</button></li>
</ul>
<h3 class="grp">Seulement quand c'est fini</h3>
<ul class="shop">
<li><button type="button" data-shop="p1">Huile d'olive</button></li>
<li><button type="button" data-shop="p2">Pâte de curry</button></li>
<li><button type="button" data-shop="p3">Ail, herbes de Provence</button></li>
<li><button type="button" data-shop="p4">Miel, sel, poivre</button></li>
<li><button type="button" data-shop="p5">Whey (30 g par jour, environ 210 g par semaine)</button></li>
</ul>
<button type="button" class="reset" id="shopreset">Tout décocher</button>
</div></details>

<details class="box acc" data-acc="a9"><summary><span class="st">Suivi</span></summary><div class="in">
<ul>
<li>Pèse-toi au moins 3 matins par semaine et compare les moyennes d'une semaine à l'autre.</li>
<li>Objectif: 1 à 1,5 kg par mois.</li>
<li>Moins de 0,15 kg par semaine pendant 3 semaines: ajoute 200 kcal (une cuillère d'huile par boîte).</li>

/* Planificateur de semaine (lundi à dimanche): essaie tous les placements possibles des 4 séances sur les jours libres et garde le mieux noté. */
var DAYS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
function planWeek(o){
  var kind=[],dep=[],i;
  for(i=0;i<7;i++){kind[i]="";dep[i]=false;}
  if(o.dep){dep[1]=true;dep[2]=true;}
  if(o.mer)kind[2]="v";
  if(o.ven===1)kind[4]="v";
  if(o.ven===2)dep[4]=true;
  if(o.match>=0)kind[o.match]="m";
  function jump(d){return d>=0&&d<7&&kind[d]!=="";}
  function score(a){
    var s=0,pos={},d,x,n,p1,p2,g;
    for(d=0;d<7;d++){x=a[d];if(!x)continue;pos[x]=d;p1=a[(d+6)%7];p2=a[(d+5)%7];
      s+=x==="jb"?90:100;
      if(x[0]==="j"){if(jump(d+1))s-=95;if(x==="ja"&&jump(d-1))s-=15;}
      else{if(kind[d+1]==="m")s-=10;else if(jump(d+1))s-=3;}
      if(p1&&p1[0]===x[0])s-=x[0]==="j"?120:45;
      if(p1&&p2)s-=8;
      if(d===6)s-=4;}
    if(pos.jb===5)s+=6;
    if(pos.hb===3)s+=3;
    if(pos.ha!=null&&pos.hb!=null&&pos.ha<pos.hb)s+=3;
    if(pos.ja!=null&&pos.jb!=null){g=Math.abs(pos.ja-pos.jb);s+=2*Math.min(3,g,7-g);}
    if(pos.ja!=null){n=null;for(d=pos.ja+1;d<7;d++)if(jump(d)){n=d;break;}if(n==null||n-pos.ja>=3)s+=2;}
    return s;
  }
  var opts=["","ja","jb","ha","hb"],best=null,bestS=-1e9,cur=[];
  (function rec(d,used){
    if(d===7){var s=score(cur);if(s>bestS){bestS=s;best=cur.slice();}return;}
    for(var k=0;k<5;k++){var x=opts[k];
      if(x){if(kind[d]||dep[d]||used[x])continue;if(x[0]==="j"&&kind[d+1]==="m")continue;if(x==="jb"&&jump(d+1))continue;used[x]=1;}
      cur[d]=x;rec(d+1,used);if(x)used[x]=0;}
  })(0,{});
  var out=[],done={};
  for(i=0;i<7;i++){var x=best[i],r={day:DAYS[i],s:x,kind:kind[i],dep:dep[i],ind:i===4&&o.ven===2&&!kind[i],note:""};
    if(x){done[x]=1;
      if(x==="ja"&&jump(i+1))r.note="Version allégée: 2 séries par exercice.";
      else if(x[0]==="h"&&jump(i+1))r.note="Garde 2 reps en réserve sur les épaules et les développés.";}
    else if(kind[i])r.note="Collation 2 h avant."+(dep[i]?" Au retour du déplacement.":"");
    out.push(r);}
  return {days:out,missing:["ja","jb","ha","hb"].filter(function(k){return !done[k];})};
}

var NAMES={ja:"Jambes A",jb:"Jambes B",ha:"Haut A",hb:"Haut B"};
function seg(name,val,list){return '<div class="seg" role="group">'+list.map(function(l){return '<button type="button" data-plan="'+name+'" data-val="'+l[0]+'" aria-pressed="'+(String(val)===String(l[0]))+'">'+l[1]+'</button>';}).join("")+'</div>';}
function planHTML(){
  var o=st.plan,p=planWeek(o),yn=[[1,"Oui"],[0,"Non"]],n=4-p.missing.length;
  var h='<div><h1>Ma semaine</h1><p class="meta">Du lundi au dimanche. Réponds aux 4 questions, le planning se met à jour.</p></div>';
  h+='<div class="box q"><h2>Match cette semaine</h2>'+seg("match",o.match,[[-1,"Non"],[0,"Lun"],[1,"Mar"],[2,"Mer"],[3,"Jeu"],[4,"Ven"]])+'<h2>Volley le mercredi</h2>'+seg("mer",o.mer?1:0,yn)+'<h2>Vendredi</h2>'+seg("ven",o.ven,[[1,"Volley"],[0,"Libre"],[2,"Indispo"]])+'<h2>Déplacement mardi et mercredi</h2>'+seg("dep",o.dep?1:0,yn)+'</div>';
  h+='<ol class="week">'+p.days.map(function(r){
    var lab,cls;
    if(r.s){lab='<button type="button" class="lnk" data-tab="'+r.s+'">'+NAMES[r.s]+'</button>';cls="gym";}
    else if(r.kind==="m"){lab="Match";cls="jump";}
    else if(r.kind==="v"){lab="Volley";cls="jump";}
    else if(r.ind){lab="Indisponible";cls="off";}
    else if(r.dep){lab="Déplacement";cls="off";}
    else{lab="Repos";cls="off";}
    return '<li class="'+cls+'"><span class="d">'+r.day+'</span><span class="w"><b>'+lab+'</b>'+(r.note?'<small>'+r.note+'</small>':'')+'</span></li>';}).join("")+'</ol>';
  h+='<div class="box"><h2>Bilan</h2><p>'+n+' séances cette semaine.'+(p.missing.length?' '+p.missing.map(function(k){return NAMES[k];}).join(" et ")+(p.missing.length>1?' sautent':' saute')+', faute de créneau qui ne gêne pas le volley.':'')+(o.match===0?' Match lundi: pas de séance jambes le dimanche d\'avant.':'')+' Touche une séance pour l\'ouvrir.</p></div>';
  return h;
}

function render(){

    Array.prototype.forEach.call(mn.querySelectorAll("[data-shop]"),function(b){b.setAttribute("aria-pressed",!!st.shop[b.dataset.shop]);});
    Array.prototype.forEach.call(mn.querySelectorAll("[data-acc]"),function(x){x.open=!!st.acc[x.dataset.acc];});return;}
  h+='<div><h1>'+esc(s.title)+'</h1><p class="meta">'+esc(s.day)+' · '+esc(s.dur)+'</p></div>';
  if(s.warn)h+='<div class="box warn">'+esc(s.warn)+'</div>';
  h+='<div class="box"><h2>Échauffement, 6 à 8 min</h2><ul>'+s.wu.map(function(w){return '<li>'+esc(w)+'</li>';}).join("")+'<li>Sur l\'exercice 1: 10 reps à moitié de ta charge, puis 5 reps aux trois quarts</li></ul></div>';
  h+='<ol class="list">';
  s.ex.forEach(function(e,i){
    var n=nsets(e),key=s.id+"-"+i,d=(st.done[s.id]||{})[i]||0,b="",isOpen=open===key,stp=stepOf(e),v=st.kg[key];

    h+='<li class="ex'+(d>=n?' finished':'')+'"><div class="num">'+(e.k||i+1)+'</div><div>'

     +'<p class="dose"><b>'+n+' × '+e.r+'</b><span>'+(st.debut?'3 à 4':e.rir)+' reps en réserve</span><span class="rest">'+(e.rest?'repos '+mmss(e.rest):'sans repos')+'</span></p>'

var end=0,iv=null;
function show(sec,label){
  var t=document.getElementById("timer");t.hidden=false;t.classList.remove("go");
  document.getElementById("tk").textContent="Repos";document.getElementById("tl").textContent=label;
  end=Date.now()+sec*1000;tick();clearInterval(iv);iv=setInterval(tick,250);
  try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){});}catch(e){}
}
function tick(){
  var left=(end-Date.now())/1000;
  if(left<=0){clearInterval(iv);document.getElementById("tt").textContent="GO";document.getElementById("tk").textContent="C'est reparti";document.getElementById("timer").classList.add("go");try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}return;}
  document.getElementById("tt").textContent=mmss(left);
}
function hide(){clearInterval(iv);document.getElementById("timer").hidden=true;}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button");if(!t)return;
  if(t.dataset.shop){if(st.shop[t.dataset.shop])delete st.shop[t.dataset.shop];else st.shop[t.dataset.shop]=1;save();t.setAttribute("aria-pressed",!!st.shop[t.dataset.shop]);return;}
  if(t.id==="shopreset"){st.shop={};save();render();return;}
  if(t.dataset.plan){var pk=t.dataset.plan,pv=+t.dataset.val;st.plan[pk]=(pk==="match"||pk==="ven")?pv:!!pv;save();render();return;}
  if(t.dataset.tab){st.tab=t.dataset.tab;open=null;save();hide();render();window.scrollTo(0,0);return;}
  if(t.dataset.open){open=open===t.dataset.open?null:t.dataset.open;render();return;}
  if(t.dataset.kg){
    var s0=cur(),j=+t.dataset.ex,key=s0.id+"-"+j,nv=Math.max(0,Math.round(((parseFloat(st.kg[key])||0)+(+t.dataset.kg)*stepOf(s0.ex[j]))*100)/100);
    st.kg[key]=nv;save();var inp=document.getElementById("kg-"+key);if(inp)inp.value=nv;return;}
  if(t.id==="reset"){st.done[st.tab]={};save();hide();render();return;}
  if(t.id==="stop"){hide();return;}
  if(t.id==="plus"){if(end>Date.now()){end+=30000;tick();}else show(30,document.getElementById("tl").textContent);return;}
  if(t.dataset.set){
    var s=cur(),i=+t.dataset.ex,k=+t.dataset.set,e=s.ex[i],n=nsets(e);
    st.done[s.id]=st.done[s.id]||{};
    var was=st.done[s.id][i]||0,now=(was===k)?k-1:k;
    st.done[s.id][i]=now;save();render();
    if(now<=was||e.k==="6a"){hide();return;}
    var pair=e.k==="6b"?s.ex[i-1]:null,label;
    if(now<n)label=(pair?"Puis "+pair.n:e.n)+", série "+(now+1)+" sur "+n;
    else if(s.ex[i+1])label="Suivant: "+s.ex[i+1].n;
    else{hide();var b=document.getElementById("timer");b.hidden=false;b.classList.add("go");document.getElementById("tt").textContent="FINI";document.getElementById("tk").textContent="Séance terminée";document.getElementById("tl").textContent="Bien joué.";return;}
    show(e.rest,label);
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;if(!t.dataset||t.dataset.kgin==null)return;
  var key=cur().id+"-"+t.dataset.kgin,v=parseFloat(String(t.value).replace(",","."));
  if(isNaN(v))delete st.kg[key];else st.kg[key]=Math.max(0,v);save();
});
document.addEventListener("toggle",function(ev){var x=ev.target;if(x.dataset&&x.dataset.acc){st.acc[x.dataset.acc]=x.open?1:0;save();}},true);
document.getElementById("debut").addEventListener("change",function(ev){st.debut=ev.target.checked;save();render();});
render();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
